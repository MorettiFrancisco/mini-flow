[project]
name = "mini-flow"
version = "0.2.0"
description = "RAG autocorrectivo en LangGraph sobre Ollama, instrumentado de punta a punta con Langfuse"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1,<2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langchain-chroma>=0.2",
    "langchain-text-splitters>=0.3",
    "langfuse>=4,<5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2",
    "python-dotenv>=1",
]

[dependency-groups]
dev = ["pytest>=8"]

# App, no librería: uv no intenta buildear ni instalar el proyecto.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
